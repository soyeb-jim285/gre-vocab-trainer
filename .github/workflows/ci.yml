name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: GRECore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v5
      - run: swift build --build-tests
      - run: swift test

  dataset:
    name: Dataset pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      - name: Self-check the committed dataset
        run: python3 tools/build_dataset.py --verify-only

  app:
    name: iOS app (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest Xcode on the image
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Show available simulators
        run: xcrun simctl list devicetypes | grep -i iphone | tail -5
      - run: brew install xcodegen xcbeautify
      - name: Generate the Xcode project
        working-directory: App
        run: xcodegen generate
      - name: Build and test
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild test \
            -project GRE.xcodeproj \
            -scheme GRE \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
